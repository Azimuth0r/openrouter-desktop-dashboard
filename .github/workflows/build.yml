name: Build and Release Windows EXE

# This tells GitHub to run the workflow ONLY when you push a tag starting with "v" (like v1.0.0)
on:
  push:
    tags:
      - "v*.*.*"

# Required permission for the action to create a release on your repository
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller requests matplotlib pillow
        
    - name: Build with PyInstaller
      # (If you decided not to use the custom icon, just delete the --icon flag)
      run: pyinstaller --noconsole --onefile --icon=app_icon.ico or_dashboard.py
      
    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        # This points to the compiled executable so it gets attached to the release
        files: dist/or_dashboard.exe
        # This auto-generates release notes based on your recent commits
        generate_release_notes: true
